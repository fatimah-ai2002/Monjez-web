<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monjez | مُنجِز</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>مُنجِز <i class="fas fa-rocket"></i></h1>
            <p>تتبع وقتك، ضاعف إنتاجيتك</p>
        </header>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="ما هي المهمة التي ستعمل عليها؟">
            <button onclick="addNewTask()">إضافة مهمة</button>
        </div>

        <div id="tasksContainer" class="tasks-grid">
            <!-- المهام ستظهر هنا كبطاقات -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
